<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Astraea">
  <title>Astraea</title>
  <rect width="32" height="32" rx="7" fill="#0B0F17"/>
  <!-- A balance: Astraea carried the scales that became the constellation Libra, and weighing independent
       evidence against itself is what the app does. The point above the beam is the star she ascended as. -->
  <g fill="#6AA7FF" transform="translate(16 16) scale(0.76) translate(-16 -16)">
    <circle cx="16" cy="5.4" r="1.9"/>
    <rect x="15" y="8.2" width="2" height="16.2" rx="1"/>
    <rect x="4" y="9.2" width="24" height="2.1" rx="1.05"/>
    <rect x="9.5" y="23.4" width="13" height="2.2" rx="1.1"/>
    <path d="M1 13.4 A 5 5 0 0 0 11 13.4 Z"/>
    <path d="M21 13.4 A 5 5 0 0 0 31 13.4 Z"/>
  </g>
</svg>
